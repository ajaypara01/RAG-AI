[project]
name = "ragai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "pandas>=3.0.6",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
ragai = "ragai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
